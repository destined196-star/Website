name: Build and deploy Node.js app to Azure Web App - devi-murlika-gaur

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v3
        with:
          node-version: '20.x'

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: .
          # Exclude node_modules — Azure will run npm install --build-from-source
          # via deploy.sh so better-sqlite3 compiles for the actual Linux runtime
          exclude-hidden-files: false

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: Remove node_modules (Azure builds natively via deploy.sh)
        run: rm -rf node_modules

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_23861F91378D45498D0BD0E36C0DE013 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_B15966249E9242F1836391977943A813 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_2B0599AD08E641FAB9E3592BEE43D283 }}

      - name: Enable and start Azure Web App
        run: |
          az webapp update --name devi-murlika-gaur --resource-group devi-murlika-rg --set enabled=true
          az webapp start --name devi-murlika-gaur --resource-group devi-murlika-rg

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'devi-murlika-gaur'
          slot-name: 'Production'
          package: .

      - name: Ensure app is started after deploy
        if: always()
        run: |
          az webapp update --name devi-murlika-gaur --resource-group devi-murlika-rg --set enabled=true
          az webapp start --name devi-murlika-gaur --resource-group devi-murlika-rg
